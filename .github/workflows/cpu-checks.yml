name: CPU protocol checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install numpy==1.23.5 scipy==1.10.1 pandas==1.5.3 matplotlib==3.7.5 pillow scikit-image==0.21.0
      - run: python -m unittest discover -s tests -v
